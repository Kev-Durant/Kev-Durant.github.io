<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script
		src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js">
	</script>

</head>

<body>
	<script>
		let i=0
		function setup(){
			createCanvas(1500,1500)
			console.log("king of the jungle")
		}
		function draw(){
			background(200)
			
			for(let i=0; i<15;i+=1){
				for(let j=0;j<15;j++){
					let x= i * 100
					let y=j * 100
					fill("pink")
					circle(x-30, y-50, 30) //left ear
					circle(x+30, y-50, 30) //right ear
					fill("tan")
					circle(x,y,100) //face
					strokeWeight(2)
					arc(x, y, 50, 50, 0, PI);
					text(i+","+j,x,y)
				}

			}

		}
	</script>

</body>
</html>
