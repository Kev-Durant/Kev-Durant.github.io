<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>project</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
</head>

<body>
	<script>
		let randomNum
		let point = 0
		let timer = 30
		

		function setup() {
			createCanvas(1500, 1500);
			randomNum = int(random(224))
		}

		function draw() {
			
			background(255, 204, 50); 

			//noStroke();
            //fill("yellow");
            //circle(mouseX, mouseY, 300);

           
            fill("blue")
            
            textSize(32);
            text("Score:"+ point, 100, 50)
            if (timer > 0) {
            	text(timer, width-100, 50);
            }
            
            

			for (let i = 0; i < 15; i++) {
				for (let j = 0; j < 15; j++) {
					let x = i * 100;
					let y = j * 100;
					
					let num = i * 15 + j

					let d = dist(x, y, mouseX, mouseY);

					push();
					translate(x, y);

					
					
					
					let scaleFactor = map(d, 0, 300, 1.5, 0.5, true); 
					scale(scaleFactor);

					

					
					


					rotate(frameCount * 0.01);

					stroke(0);
                    strokeWeight(1);

					fill("pink");
					circle(-30, -50, 30); 
					circle(30, -50, 30);  
                    
					if (num === randomNum) {
						fill("#e3b16b")
					} else {
						fill("tan");
					}
										
					circle(0, 0, 100);   
                    
					
					strokeWeight(2);
					arc(0, 0, 50, 50, 0, PI);
					
					
					fill("white");
					circle(-20, -20, 20); 
					circle(20, -20, 20);  

					fill("black");
					circle(-20, -17, 10); 
					circle(20, -17, 10);  

					//fill("green")
					//text(num, 0,0)
					pop();
				}
			}

			if (frameCount % 60 == 0 && timer > 0) { // if the frameCount is divisible by 60, then a second has passed. it will stop at 0
		    timer --;
		  }
		  if (timer == 0) {
		    text("GAME OVER", width-320, 50);
		  }
		}

		function mousePressed(){for (let i = 0; i < 15; i++) {
				for (let j = 0; j < 15; j++) {
					let x = i * 100;
					let y = j * 100;
					let num = i * 15 + j;
					let d = dist(x, y, mouseX, mouseY);
					
					
					let scaleFactor = map(d, 0, 300, 1.5, 0.5, true);
					let hitRadius = 50 * scaleFactor; 

					
					if (d < hitRadius) {
						
						if (num === randomNum) {
							if (timer > 0) {
								point++; 
							}
							randomNum = int(random(225)); 
						}
						return; 
					}
				}
			}
		}
	</script>
</body>
</html>
