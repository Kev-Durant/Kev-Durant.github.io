<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>

<body>
<script>

function setup() {
  createCanvas(1500, 1500)
}

function draw() {
  background(200)

  for (let i = 0; i < 15; i++) {
    for (let j = 0; j < 15; j++) {

      let x = i * 100
      let y = j * 100

      let d = dist(x, y, mouseX, mouseY)

      // closer to mouse = bigger
      let s = map(d, 0, 500, 1.5, 0.5)
      s = constrain(s, 0.5, 1.5)

      push()

      translate(x, y)
      scale(s)
      rotate(frameCount * 0.01)

      // ears
      fill("pink")
      circle(-30, -50, 30)
      circle(30, -50, 30)

      // face
      fill("tan")
      circle(0, 0, 100)

      // mouth
      strokeWeight(2)
      arc(0, 0, 50, 50, 0, PI)

      // eyes
      fill("white")
      circle(-20, -20, 20)
      circle(20, -20, 20)

      fill("black")
      circle(-20, -17, 10)
      circle(20, -17, 10)

      pop()
    }
  }
}

</script>
</body>
</html>
