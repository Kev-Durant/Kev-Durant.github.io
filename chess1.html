<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spinning Faces</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
</head>

<body>
    <script>
        function setup() {
            createCanvas(1500, 1500);
            console.log("king of the jungle");
        }

        function draw() {
            // 1. Draw the main yellow background first
            background(255, 204, 50); 

            // 2. Draw a blue circle at the mouse's location
            // A 50-pixel radius means the circle needs a diameter of 100
            noStroke();
            fill("blue");
            circle(mouseX, mouseY, 600);

            // 3. Draw the grid of faces on top
            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    let x = i * 100;
                    let y = j * 100;
                    
                    let d = dist(x, y, mouseX, mouseY);

                    push();
                    translate(x, y);
                    
                    let scaleFactor = map(d, 0, 300, 1.5, 0.5, true); 
                    scale(scaleFactor);

                    rotate(frameCount * 0.01);

                    // Reset stroke for the faces so they have borders again
                    stroke(0);
                    strokeWeight(1);
                    
                    fill("pink");
                    circle(-30, -50, 30); 
                    circle(30, -50, 30);  
                    
                    fill("tan");
                    circle(0, 0, 100);   
                    
                    strokeWeight(2);
                    arc(0, 0, 50, 50, 0, PI);
                    
                    strokeWeight(1);
                    fill("white");
                    circle(-20, -20, 20); 
                    circle(20, -20, 20);  

                    fill("black");
                    circle(-20, -17, 10); 
                    circle(20, -17, 10);  

                    pop();
                }
            }
        }
    </script>
</body>
</html>
