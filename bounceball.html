<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
<script>
let xpos
let ypos
let xspeed
let yspeed
let d = 50
let fillColor = "blue"
function setup() {
createCanvas(800,800)
xpos = width/2
ypos = height/2
xspeed = 5
yspeed = 8
}

function draw() {
background(200)
d=getRandomDiameter(10,100)
if (xpos + d/2 > width || xpos - d/2 < 0) {
xspeed = xspeed * -1
}
if (ypos + d/2 > height || ypos - d/2 < 0) {
yspeed = yspeed * -1
}
changeBallColor("pink", "lightgreen", "lightblue", "white")
xpos = xpos + xspeed
ypos = ypos + yspeed
fill(fillColor)
circle(xpos, ypos, d)

function getRandomDiameter(minSize,maxSize){
	let randomDiameter = (30,50)
	return randomDiameter
}

}

function changeBallColor(topRightColor, bottomRightColor, topLeftColor, bottomLeftColor) {
if (xpos > width/2 && ypos < height/2) { // top right
fillColor = topRightColor
} else if (xpos > width/2 && ypos > height/2) { // bottom right
fillColor = bottomRightColor
} else if (xpos < width/2 && ypos < height/2) { //top left
fillColor = topLeftColor
} else { //bottom left
fillColor = bottomLeftColor
}
}
</script>
</body>
</html>
