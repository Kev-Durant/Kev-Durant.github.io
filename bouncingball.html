<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
</head>
<body>
<script>
	let xpos
	let ypos
	let xspeed
	let yspeed
	let d = 50
function setup (){
	createCanvas(800,800)
	xpos = width/2
	ypos = height/2
	xspeed = 5
	yspeed= 8

}

function draw(){
	background(200)
	if (xpos+d/2 > width || xpos-d/2< 0){
		xspeed = xspeed * -1
	}
	if (ypos +d/2> height|| ypos < 0){
		yspeed = yspeed * -1
	}

	
	xpos += xspeed
	ypos += yspeed
	fill("orange")
	circle(xpos,ypos,d)
}



</script>
</body>
</html>
